'조건에 맞는 멤버가 없습니다. 검색어나 연맹을 바꿔보세요.':'No matching members. Change the search or alliance filter.'
};
function english(text,el){
 if(el.id==='account-context'&&accountData.uid)return 'Server '+accountData.serverId+' · Current alliance '+(accountData.alliance||'Checking')+(accountData.allianceName?' ('+accountData.allianceName+')':'');
 if(el.id==='account-context')return 'Waiting for account information';
 if(translations[text])return translations[text];
 if(el.matches('footer'))return 'Members are based on the collected alliance roster. Other alliances show only collected ranking entries. Unavailable hero power is marked Unknown; unavailable contribution scores are shown and sorted as 0. Names and alliances follow the collected roster.';
 if(el.matches('main>div.note'))return 'Contribution rankings for Mutual Support, Siege, Contestation and Kills. The reporting period is being verified; totals and averages apply to the selected category.';
 if(el.id==='count')return text.replace(/([\d,]+)명/,'$1 members').replace('전체 연맹','All alliances');
 if(el.id==='updated-at'&&text)return 'Hero power collected · '+new Date(heroData.capturedAt).toLocaleString('en-US',{timeZone:'Asia/Seoul'})+' KST';
 if(text.startsWith('상시 수집 중'))return 'Collecting · '+text.match(/[\d,]+/g)?.slice(0,2).join(' packets / ')+' responses. Open ranking tabs in the game to update.';
 if(text.startsWith('수집 중 ·'))return 'Collecting · '+text.match(/\d+/)?.[0]+' seconds left. Open the four contribution ranking tabs.';
 if(text.startsWith('갱신 완료'))return 'Update complete. Categories not opened retain their previous data.';
 return '';
}
function apply(){
 observer.disconnect();
 document.querySelectorAll('.page-tabs button,h1,.intro,#account-context,#heading,#count,#updated-at,#copy-share,#share-feedback,#sync,#stop-sync,#sync-status,main>.note,footer,.foot>span,#thead th:not(:has(button)),.column-sort,#tbody .empty,#tbody .meta,#tbody td.num').forEach(el=>{
  if(el.matches('.note')&&el.querySelector('#sync-status'))return;
  el.querySelectorAll(':scope>.en-line').forEach(n=>n.remove());
  const text=el.textContent.trim().replace(/\s*[↑↓↕]$/,'');const translated=english(text,el);
  if(translated){const line=document.createElement('span');line.className='en-line';line.lang='en';line.textContent=translated;el.append(line)}
 });
 observer.observe(document.body,{childList:true,subtree:true,characterData:true});
}
const observer=new MutationObserver(apply);apply();
})();
</script>
